<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasteMax Browser</title>
    <style>
        :root {
            /* Light theme variables */
            --primary-color: #0078d4;
            --text-color: #1a1a1a;
            --secondary-color: #666666;
            --background-color: #ffffff;
            --hover-color: #f5f5f5;
            --card-background: #ffffff;
            --card-border: rgba(0, 0, 0, 0.1);
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --card-hover-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            --search-background: #f5f5f5;
            --search-text: #1a1a1a;
            --search-placeholder: #666666;
            --icon-color: #0078d4;
            --gradient-start: #0078d4;
            --gradient-end: #666666;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark theme variables */
                --primary-color: #4cc2ff;
                --text-color: #e0e0e0;
                --secondary-color: #a0a0a0;
                --background-color: #1a1a1a;
                --hover-color: #2d2d2d;
                --card-background: #2d2d2d;
                --card-border: rgba(255, 255, 255, 0.1);
                --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
                --card-hover-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
                --search-background: #2d2d2d;
                --search-text: #e0e0e0;
                --search-placeholder: #a0a0a0;
                --icon-color: #4cc2ff;
                --gradient-start: #4cc2ff;
                --gradient-end: #a0a0a0;
            }
        }

        [data-theme="light"] {
            /* Light theme variables */
            --primary-color: #0078d4;
            --text-color: #1a1a1a;
            --secondary-color: #666666;
            --background-color: #ffffff;
            --hover-color: #f5f5f5;
            --card-background: #ffffff;
            --card-border: rgba(0, 0, 0, 0.1);
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --card-hover-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            --search-background: #f5f5f5;
            --search-text: #1a1a1a;
            --search-placeholder: #666666;
            --icon-color: #0078d4;
            --gradient-start: #0078d4;
            --gradient-end: #666666;
        }

        [data-theme="dark"] {
            /* Dark theme variables */
            --primary-color: #4cc2ff;
            --text-color: #e0e0e0;
            --secondary-color: #a0a0a0;
            --background-color: #1a1a1a;
            --hover-color: #2d2d2d;
            --card-background: #2d2d2d;
            --card-border: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --card-hover-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
            --search-background: #2d2d2d;
            --search-text: #e0e0e0;
            --search-placeholder: #a0a0a0;
            --icon-color: #4cc2ff;
            --gradient-start: #4cc2ff;
            --gradient-end: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            padding: 20px;
        }
        
        .logo {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            transition: background 0.3s ease;
        }
        
        .search-container {
            position: relative;
            margin-bottom: 50px;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .search-box {
            width: 100%;
            padding: 16px 50px;
            font-size: 16px;
            border: 2px solid transparent;
            border-radius: 30px;
            background-color: var(--search-background);
            color: var(--search-text);
            transition: all 0.3s ease;
        }
        
        .search-box::placeholder {
            color: var(--search-placeholder);
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--card-background);
            box-shadow: var(--card-shadow);
        }
        
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-color);
            font-size: 18px;
            transition: color 0.3s ease;
        }
        
        .shortcuts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            padding: 0 20px;
        }
        
        .shortcut {
            background-color: var(--card-background);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--card-border);
        }
        
        .shortcut:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
            border-color: var(--primary-color);
        }
        
        .shortcut-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--icon-color);
            transition: transform 0.3s ease, color 0.3s ease;
        }
        
        .shortcut:hover .shortcut-icon {
            transform: scale(1.1);
            color: var(--primary-color);
        }
        
        .shortcut-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
            transition: color 0.3s ease;
        }
        
        .footer {
            margin-top: 40px;
            color: var(--secondary-color);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer span {
            color: var(--primary-color);
            transition: color 0.3s ease;
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            
            .logo {
                font-size: 32px;
            }
            
            .shortcuts {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 15px;
            }
            
            .shortcut {
                padding: 15px;
            }
        }
    </style>
</head>

    <script>
        // Theme management
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('pastemax-theme-mode', theme);
        }

        // Initialize theme
        function initializeTheme() {
            const savedTheme = localStorage.getItem('pastemax-theme-mode');
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                // Check system preference
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setTheme('dark');
                } else {
                    setTheme('light');
                }
            }
        }

        // Watch for system theme changes
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (!localStorage.getItem('pastemax-theme-mode')) {
                    setTheme(e.matches ? 'dark' : 'light');
                }
            });
        }

        // Initialize theme on load
        initializeTheme();

        // Search functionality
        document.getElementById('search-box').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                let query = this.value.trim();
                
                // Check if input is a URL
                if (query.includes('.') && !query.includes(' ') && 
                    !/\s/.test(query) && query.length > 3) {
                    // Looks like a URL - add https if missing
                    if (!/^https?:\/\//i.test(query)) {
                        query = 'https://' + query;
                    }
                    window.location.href = query;
                } else {
                    // Not a URL, search with Google
                    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
                }
            }
        });
    </script>
